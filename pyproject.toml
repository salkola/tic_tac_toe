[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tic-tac-toe"
version = "0.1.0"
description = "Tic-tac-toe policy-value MCTS with minimax pretraining and learning metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[project.scripts]
tic-tac-toe-train = "train:main"
tic-tac-toe-play = "gui:main"
tic-tac-toe-play-cli = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "eval", "game", "play", "training"]

[tool.hatch.build.targets.wheel.force-include]
"train.py" = "train.py"
"cli.py" = "cli.py"
"gui.py" = "gui.py"
"config.py" = "config.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
